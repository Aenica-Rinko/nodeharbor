name: Tests and release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/release.py --check
      - if: runner.os == 'Windows'
        run: python -B -m pytest -q -rs -p no:cacheprovider
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -B -m pytest -q -rs -p no:cacheprovider
      - run: python -m build
      - run: python scripts/release.py --check-artifacts dist
      - if: runner.os == 'Windows' && matrix.python == '3.13'
        run: python -m pip install -e ".[windows]"
      - if: runner.os == 'Windows' && matrix.python == '3.13'
        run: |
          python scripts/windows/build_exe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $buildReport = Get-Content .release/latest-windows.json -Raw | ConvertFrom-Json
          python scripts/windows/check_exe.py $buildReport.bundle
